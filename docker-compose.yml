services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: ssdlc
      MYSQL_USER: serviceuser
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      bridge_net:
        ipv4_address: 172.25.0.2

  legacy-php:
    depends_on:
      - mysql
    build:
      context: .
      dockerfile: Dockerfile.php-apache
    container_name: legacy-php
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    networks:
      bridge_net:
        ipv4_address: 172.25.0.3

  kali-linux-desktop:
    image: iphoneintosh/kali-docker:large
    container_name: kali-desktop
    environment:
      VNCPWD: password123
      VNCPORT: 5900
      NOVNCPORT: 8080
    ports:
      - "9020:8080"
      - "9021:5900"
    networks:
      bridge_net:
        ipv4_address: 172.25.0.4
    tty: true
    stdin_open: true

  desktop:
    image: prbinu/novnc-desktop
    environment:
      TZ: America/Los_Angeles
    container_name: desktop
    ports:
      - "9002:8080"
    networks:
      bridge_net:
        ipv4_address: 172.25.0.5

networks:
  bridge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/26
